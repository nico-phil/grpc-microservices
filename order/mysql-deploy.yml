apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      name: mysql-pod
  template:
    metadata:
      name: mysql-pod
      labels:
        name: mysql-pod
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.30
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "secretpassword"
            - name: MYSQL_DATABASE
              value: "order"

---
apiVersion: v1
kind: Service
metadata:
  name: db-mysql
  labels:
    name: db-mysql
spec:
  selector:
    name: mysql-pod
  ports:
    - port: 3306
      targetPort: 3306
